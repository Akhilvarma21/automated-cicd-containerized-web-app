apiVersion: apps/v1
kind: Deployment
metadata:
  name: automated-cicd-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: automated-cicd-web-app
  template:
    metadata:
      labels:
        app: automated-cicd-web-app
    spec:
      containers:
        - name: automated-cicd-container
          image: automated-cicd-web-app:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000