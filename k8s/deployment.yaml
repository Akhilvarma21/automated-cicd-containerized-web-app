apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-devops-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-devops-app

  template:
    metadata:
      labels:
        app: cloud-devops-app

    spec:
      containers:
        - name: cloud-devops-container
          image: cloud-devops-app:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000